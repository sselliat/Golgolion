name: 이슈 등록
description: 작업, 버그, 기능 또는 문서 변경을 한글로 등록합니다.
title: '[이슈] '
body:
  - type: markdown
    attributes:
      value: |
        사람이 읽는 제목과 본문은 한글로 작성해 주세요.
        코드 식별자, 명령어, URL, 이슈 번호는 필요한 경우 원문을 사용할 수 있습니다.

  - type: dropdown
    id: category
    attributes:
      label: 유형
      options:
        - 작업
        - 버그
        - 기능
        - 문서
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 무엇을 해결하거나 달성하려는지 작성해 주세요.
      placeholder: 이 이슈의 목적을 한글로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 포함할 작업과 제외할 작업을 작성해 주세요.
      placeholder: 포함 범위와 제외 범위를 한글로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업이 완료되었다고 판단할 조건을 작성해 주세요.
      placeholder: 검증 가능한 완료 조건을 한글로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고
      description: 관련 이슈, PR, 문서 또는 기술적 제약을 작성해 주세요.
      placeholder: 관련 링크와 참고 사항을 작성해 주세요.
